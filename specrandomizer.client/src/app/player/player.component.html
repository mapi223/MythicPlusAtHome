
<div [ngClass]="{'grey': player.id%2 === 0 }">
  <label for="PlayerName">{{player.PlayerName}}</label>
    <input type="text" id="PlayerName" [(ngModel)] ="player.PlayerName">
    <app-class-list
    (selectionOutput)="inputPlayerSelection($event)"
    [isLoading]="isLoading"
    ></app-class-list>
</div>
